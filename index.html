<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mây An & Hồng Thiên - Word Adventure</title>
    <link rel="stylesheet" href="style.css?v=63" />
  </head>
  <body>
    <div class="bg-names" aria-hidden="true">
      <span class="bg-name bg-name-1">☁️ Mây An</span>
      <div class="bg-photo">
        <img src="images/may-an-hong-thien.webp" alt="" />
      </div>
      <span class="bg-name bg-name-2">🌸 Hồng Thiên</span>
    </div>


    <div id="confetti-container"></div>

    <audio src="sounds/success.mp3" id="success-sound" preload="auto"></audio>
    <audio src="sounds/error.wav" id="error-sound" preload="auto"></audio>
    <audio src="sounds/win.mp3" id="win-sound" preload="auto"></audio>

    <div id="start-screen" class="start-screen">
      <h2>Hello Mây An & Hồng Thiên! 🌞</h2>
      <p>Play word games, practice spelling and collect lots of points!</p>
      <button id="start-btn">Start Game</button>
    </div>

    <div id="menu-screen" class="menu-screen hidden">
      <h2>Choose a game 🎲</h2>
      <div id="game-menu" class="game-menu"></div>
      <button id="sc-open" class="sc-open">🔧 Sound check</button>
    </div>

    <main id="game-area" class="hidden">
      <div class="game-card">
        <nav class="game-topbar card-toolbar">
          <div id="score-board"><span class="ri">⭐</span><span class="rl">0</span></div>
          <div id="best-board"><span class="ri">🏆</span><span class="rl">0</span></div>
          <button id="menu-btn" title="Games" aria-label="Games"><span class="ri">🏠</span><span class="rl">Games</span></button>
          <button id="play-again-btn" title="Play again" aria-label="Play again"><span class="ri">🔁</span><span class="rl">Again</span></button>
          <button id="reset-btn" title="Reset" aria-label="Reset"><span class="ri">🔄</span><span class="rl">Reset</span></button>
          <button id="music-btn" title="Music" aria-label="Music"><span class="ri">🎵</span><span class="rl">Music</span></button>
          <button id="mute-btn" title="Sound" aria-label="Sound"><span class="ri">🔊</span><span class="rl">Sound</span></button>
        </nav>
        <!-- Bản đồ: Trò chơi 🐾 Cấp độ 🐾 Chủ đề, bấm vào để xổ danh sách -->
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="bc-panel hidden" id="bc-panel">
          <div class="bc-list" id="bc-games"></div>
          <div class="mode-buttons" id="mode-buttons"></div>
          <div class="category-buttons" id="category-buttons"></div>
        </div>
        <div class="play-area">
          <div id="subtitle" class="question">Choose a category to begin!</div>
          <div id="tip" class="tip">👆 Choose a category above to start!</div>
          <div id="game-container"></div>
          <div id="word-picker"></div>
          <div class="check-container hidden" id="check-container">
            <button id="hint-btn">💡 Hint (-2)</button>
            <button id="speak-btn" class="hidden"><span class="ri">🔈</span><span>Listen</span></button>
            <button id="check-btn">✅ Check Answer</button>
          </div>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <h1 class="heading">Word Adventure 🎮</h1>
    </footer>

    <div id="msg-box" role="status" aria-live="polite"></div>

    <script src="audio.js?v=63"></script>
    <script src="script.js?v=63"></script>
    <script src="icons.js?v=63"></script>
    <script src="definitions.js?v=63"></script>
    <script src="soundcheck.js?v=63"></script>
    <script src="games.js?v=63"></script>
  </body>
</html>
