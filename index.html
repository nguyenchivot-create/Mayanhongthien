<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mây An & Hồng Thiên - Word Adventure</title>
    <link rel="stylesheet" href="style.css?v=31" />
  </head>
  <body>
    <div class="bg-names" aria-hidden="true">
      <span class="bg-name bg-name-1">☁️ Mây An</span>
      <span class="bg-name bg-name-2">🌸 Hồng Thiên</span>
    </div>
    <header class="site-header">
      <h1 class="heading">Word Adventure 🎮</h1>
    </header>

    <nav class="game-topbar rail-left">
      <div id="score-board"><span class="ri">⭐</span><span class="rl">0</span></div>
      <div id="best-board"><span class="ri">🏆</span><span class="rl">0</span></div>
      <button id="menu-btn"><span class="ri">🏠</span><span class="rl">Games</span></button>
      <button id="play-again-btn"><span class="ri">🔁</span><span class="rl">Again</span></button>
      <button id="reset-btn"><span class="ri">🔄</span><span class="rl">Reset</span></button>
      <button id="music-btn"><span class="ri">🎵</span><span class="rl">Music</span></button>
      <button id="mute-btn"><span class="ri">🔊</span><span class="rl">Sound</span></button>
    </nav>

    <div id="confetti-container"></div>

    <audio src="sounds/success.mp3" id="success-sound"></audio>
    <audio src="sounds/error.wav" id="error-sound"></audio>
    <audio src="sounds/win.mp3" id="win-sound"></audio>

    <div id="start-screen" class="start-screen">
      <h2>Hello Mây An & Hồng Thiên! 🌞</h2>
      <p>Play word games, practice spelling and collect lots of points!</p>
      <button id="start-btn">Start Game</button>
    </div>

    <div id="menu-screen" class="menu-screen hidden">
      <h2>Choose a game 🎲</h2>
      <div id="game-menu" class="game-menu"></div>
    </div>

    <nav class="mode-buttons rail-right hidden" id="mode-buttons"></nav>

    <main id="game-area" class="hidden">
      <div class="game-card">
        <div class="card-controls">
          <div class="category-buttons" id="category-buttons"></div>
        </div>

        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="play-area">
          <div id="subtitle" class="question">Choose a category to begin!</div>
          <div id="tip" class="tip">👆 Choose a category above to start!</div>
          <div id="game-container"></div>
          <div id="word-picker"></div>
          <div class="check-container hidden" id="check-container">
            <button id="hint-btn">💡 Hint (-2)</button>
            <button id="speak-btn" class="hidden"><span class="ri">🔈</span><span>Listen</span></button>
            <button id="check-btn">✅ Check Answer</button>
          </div>
        </div>
      </div>
    </main>

    <div id="msg-box" role="status" aria-live="polite"></div>

    <script src="music.js?v=31"></script>
    <script src="script.js?v=31"></script>
    <script src="icons.js?v=31"></script>
    <script src="definitions.js?v=31"></script>
    <script src="games.js?v=31"></script>
  </body>
</html>
