<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mây An & Hồng Thiên - Phiêu Lưu Từ Vựng</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="kids-banner">
      <span class="kid kid-1">☁️ Mây An</span>
      <span class="heart">💖</span>
      <span class="kid kid-2">🌸 Hồng Thiên</span>
    </div>
    <h1 class="heading">Phiêu Lưu Từ Vựng 🎮</h1>
    <p id="subtitle">Sắp xếp các từ theo đúng thứ tự.</p>

    <div class="game-topbar">
      <div id="score-board">⭐ Điểm: 0</div>
      <div id="best-board">🏆 Kỷ lục: 0</div>
      <button id="play-again-btn">🔁 Chơi lại</button>
      <button id="reset-btn">🔄️ Làm mới</button>
      <button id="mute-btn">🔊 Bật âm</button>
    </div>

    <div id="word-picker"></div>
    <div id="confetti-container"></div>

    <audio src="sounds/success.mp3" id="success-sound"></audio>
    <audio src="sounds/error.wav" id="error-sound"></audio>
    <audio src="sounds/win.mp3" id="win-sound"></audio>
    <audio src="sounds/bg-music.mp3" id="bg-music" loop></audio>

    <div id="start-screen" class="start-screen">
      <h2>Chào Mây An và Hồng Thiên! 🌞</h2>
      <p>Sắp xếp từ, luyện đánh vần tiếng Anh và ghi thật nhiều điểm!</p>
      <button id="start-btn">Bắt đầu</button>
    </div>

    <div id="game-area" class="hidden">
      <div class="game-card">
        <p id="tip" class="tip">💡 Kéo-thả hoặc chạm vào 2 ô để đổi chỗ</p>
        <div id="game-container"></div>
        <div class="category-buttons" id="category-buttons"></div>
      </div>
      <div class="check-container hidden" id="check-container">
        <button id="hint-btn">💡 Gợi ý (-2)</button>
        <button id="speak-btn" class="hidden">🔈 Nghe</button>
        <button id="check-btn">✅ Kiểm tra</button>
      </div>
    </div>
    <div id="msg-box"></div>

    <script src="script.js"></script>
  </body>
</html>
